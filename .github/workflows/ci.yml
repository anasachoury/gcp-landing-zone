name: ci

# Static checks only — no GCP credentials needed, so this always runs,
# even for fork PRs and before bootstrap has been executed.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: check formatting
        run: terraform fmt -check -recursive
      - name: validate all root modules
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          fail=0
          for dir in bootstrap/tf bootstrap/tf-gate stages/01-org stages/02-networking stages/03-security stages/10-factory; do
            echo "=== validate $dir ==="
            ( cd "$dir" \
              && terraform init -backend=false -input=false >/dev/null \
              && terraform validate -no-color ) || fail=1
          done
          exit $fail

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3
      - run: tflint --init
      - run: tflint --recursive

  catalogs:
    name: catalog validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install pyyaml
        run: python -m pip install --quiet pyyaml==6.0.3
      - run: python3 scripts/validate_catalogs.py

  checkov:
    name: checkov (soft-fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          # Soft-fail out of the box so findings do not block the first
          # week. Review them, then flip to hard fail.
          soft_fail: true

  # TEMPORARY e2e probe for this PR: proves the deploy gate job's
  # assumption that the ephemeral GITHUB_TOKEN (contents: read) can read
  # environment protection rules. Removed before merge.
  gate-probe:
    name: gate-probe (temporary, removed before merge)
    runs-on: ubuntu-latest
    steps:
      - name: read environment protection rules with github.token
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/environments/landing-zone
        run: |
          set -euo pipefail
          echo "repository: $GITHUB_REPOSITORY"
          echo "--- raw protection_rules ---"
          if ! response="$(curl -sfSH "Authorization: Bearer $GH_TOKEN" "$API")"; then
            echo "FETCH FAILED (exit $?) — gate job would report environment missing"
            exit 0
          fi
          echo "$response" | jq '.protection_rules'
          echo "--- gate-job jq verdict ---"
          if jq -e '[.protection_rules[]? | select(.type == "required_reviewers")] | length > 0' >/dev/null <<<"$response"; then
            echo "GATE PASSES (apply would be allowed)"
          else
            echo "GATE FAILS (apply would be blocked)"
          fi
