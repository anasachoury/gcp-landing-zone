name: deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Never cancel a deploy mid-apply: queued runs wait for the current one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # OIDC federation to GCP
  contents: read # also covers reading environment protection rules (gate job)

env:
  TF_VERSION: "1.9.8"
  STAGES: "01-org 02-networking 03-security 10-factory"

jobs:
  plan:
    name: plan / ${{ matrix.stage }}
    # Requires bootstrap to have run (repo variables exist) and a
    # same-repository PR (forks get no OIDC token by design).
    if: >-
      github.event_name == 'pull_request' &&
      vars.GCP_WIF_PROVIDER != '' &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [01-org, 02-networking, 03-security, 10-factory]
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          token_format: access_token
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform plan
        run: |
          set -euo pipefail
          stage="${{ matrix.stage }}"
          cd "stages/$stage"
          terraform init -input=false \
            -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}" \
            -backend-config="prefix=landing-zone/$stage"
          set +e
          terraform plan -input=false -no-color -detailed-exitcode \
            -var "org_id=${{ vars.GCP_ORG_ID }}" \
            -var "billing_account=${{ vars.GCP_BILLING_ACCOUNT }}" \
            -var "prefix=${{ vars.LZ_PREFIX }}" \
            -var "state_bucket=${{ vars.GCP_STATE_BUCKET }}"
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::error::terraform plan failed for $stage"
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "### $stage: changes detected (see log)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### $stage: no changes" >> "$GITHUB_STEP_SUMMARY"
          fi

  apply:
    name: apply (stages in order)
    needs: gate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.GCP_WIF_PROVIDER != ''
    # The "landing-zone" environment must have required reviewers configured
    # (bootstrap/tf-gate, or Settings → Environments). The gate job below
    # fails the run if it does not, and GitHub itself blocks the apply until
    # a reviewer approves.
    environment: landing-zone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          token_format: access_token
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: apply all stages in dependency order
        run: |
          set -euo pipefail
          for stage in ${{ env.STAGES }}; do
            echo "=== Applying $stage ==="
            (
              cd "stages/$stage"
              terraform init -input=false \
                -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}" \
                -backend-config="prefix=landing-zone/$stage"
              terraform apply -input=false -no-color -auto-approve \
                -var "org_id=${{ vars.GCP_ORG_ID }}" \
                -var "billing_account=${{ vars.GCP_BILLING_ACCOUNT }}" \
                -var "prefix=${{ vars.LZ_PREFIX }}" \
                -var "state_bucket=${{ vars.GCP_STATE_BUCKET }}"
            )
            echo "### $stage: applied" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "All stages applied." >> "$GITHUB_STEP_SUMMARY"

  # Fail-closed gate: the apply above must not run unless the landing-zone
  # environment has required reviewers. This catches the case where bootstrap
  # was run without the reviewer step, or someone removed the reviewers
  # afterwards — GitHub's environment protection only exists if it is
  # configured, and an unconfigured environment silently passes everything
  # through.
  gate:
    name: gate / environment reviewers configured
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    steps:
      - name: require required reviewers on the landing-zone environment
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/environments/landing-zone
        run: |
          set -euo pipefail
          echo "Checking protection rules for environment 'landing-zone'..."
          # 404: environment does not exist at all → not gated.
          if ! response="$(curl -sfSH "Authorization: Bearer $GH_TOKEN" "$API")"; then
            echo "::error::Environment 'landing-zone' does not exist. Run bootstrap/tf-gate (bootstrap.sh --github-token ... --reviewer-users ...) or create it with required reviewers in Settings → Environments."
            exit 1
          fi
          # Missing protection_rules, or none of type required_reviewers → not gated.
          if ! jq -e '[.protection_rules[]? | select(.type == "required_reviewers")] | length > 0' >/dev/null <<<"$response"; then
            echo "::error::Environment 'landing-zone' exists but has NO required reviewers: every push to main would apply without a human approval. Run bootstrap/tf-gate to add reviewers, or Settings → Environments → landing-zone → Required reviewers."
            exit 1
          fi
          echo "Protection rules:"
          echo "$response" | jq -r '.protection_rules[] | "  - \(.type)"'
          echo "::notice::landing-zone environment is reviewer-gated. Approve the apply job to proceed."
