# Org policy library — applied at organization level by stage 01-org.
#
# types:
#   boolean → enforce: true | false
#   list    → enforcement: "deny" (deny all) | "allow" (allow all)
#             or explicit value lists via allowed_values / denied_values
#
# exceptions: folder names (from folders.yaml) where the constraint is
# LIFTED. Stage 01-org renders a folder-level override policy for each.

policies:
  # --- identity hygiene ---
  - constraint: constraints/iam.disableServiceAccountKeyCreation
    type: boolean
    enforce: true
  - constraint: constraints/iam.automaticIamGrantsForDefaultServiceAccounts
    type: boolean
    enforce: true

  # --- no public exposure ---
  - constraint: constraints/storage.publicAccessPrevention
    type: boolean
    enforce: true
  - constraint: constraints/sql.restrictPublicIp
    type: list
    enforcement: deny
  - constraint: constraints/compute.vmExternalIpAccess
    type: list
    enforcement: deny
    exceptions: [sandbox]

  # --- sane defaults ---
  - constraint: constraints/compute.skipDefaultNetworkCreation
    type: boolean
    enforce: true
  - constraint: constraints/compute.requireShieldedVm
    type: boolean
    enforce: true
    exceptions: [sandbox]

  # --- data residency ---
  # EDIT: the regions you allow resources in. "in:eu-locations" is a
  # Google-maintained region group; you can also list explicit regions
  # like "europe-west1".
  - constraint: constraints/gcp.resourceLocations
    type: list
    allowed_values: ["in:eu-locations"]
